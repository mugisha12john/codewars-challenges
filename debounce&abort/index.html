<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- <script src="promise.js"></script> -->
    <input
      type="text"
      id="input"
      style="padding: 2px; font-size: 21px"
      autocomplete="off"
    />
    <div style="display: flex; align-items: center">
      <h1>Default:</h1>
      <p
        style="font-size: 24px; font-weight: 500; margin-left: 12px"
        id="default"
      ></p>
    </div>
    <div style="display: flex; align-items: center">
      <h1>Debounce:</h1>
      <p
        style="font-size: 24px; font-weight: 500; margin-left: 12px"
        id="debounce"
      ></p>
    </div>
    <div style="display: flex; align-items: center">
      <h1>Throttling:</h1>
      <p
        style="font-size: 24px; font-weight: 500; margin-left: 12px"
        id="throttling"
      ></p>
    </div>
    <script src="debounce.js"></script>
  </body>
</html>
